name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter=platform exec tsc --noEmit

      - name: Lint
        run: pnpm --filter=platform lint

      - name: Test
        run: pnpm --filter=platform test

      # Fresh-install replay of supabase/migrations + seed + SQL checks on an
      # in-process Postgres 17, compared with the recorded Staging schema
      # fingerprint. Needs no Docker and no credentials; never touches a
      # hosted database. CI does not apply migrations anywhere.
      - name: Database migration replay
        run: pnpm db:verify